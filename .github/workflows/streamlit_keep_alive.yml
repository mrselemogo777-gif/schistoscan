name: Keep Streamlit apps awake
on:
  schedule:
    - cron: '0 */8 * * *' # Every 8 hours, under the 12-hour sleep threshold
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: gpenessot/streamlit-keep-alive@v1
        with:
          app-urls: |
            https://pula-watch.streamlit.app
            https://schistoscan.streamlit.app
